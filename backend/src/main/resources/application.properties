spring.application.name=backend
# CONEXION A POSTGRESQL
# La contraseña no se guarda aquí. Usa SPRING_DATASOURCE_PASSWORD
# o backend/config/application.properties, que Git ignora.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/practicasiat}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:usuario_siat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# CONFIGURACION JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true